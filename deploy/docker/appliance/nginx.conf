# Serve the built dashboard with the API and the bridge reachable on the same
# origin, so the browser never needs a second host. Served on :80 (published
# as 5173 by the run command); the API and bridge stay independently
# publishable for tools that want them direct.

server {
    listen 80 default_server;
    server_name _;

    root /app/web;
    index index.html;

    # gzip for the big JS bundles
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA history fallback: every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must never be cached: it carries the content-hashed asset
    # references, and a stale copy keeps loading the previous bundle after an
    # image upgrade (observed as "React error #130" from the old JS).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Static assets are content-hashed; cache them hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API on the same origin (dashboard talks to window origin first).
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    # Realtime websocket passthrough (Phoenix socket lives here in the full
    # stack; the appliance bridges events over Redis so this stays optional).
    location /socket/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # The AI bridge, same origin, so BRIDGE_URL can be relative.
    location /bridge/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # Open/click tracking pixels.
    location /t/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
    }

    # config.js is rendered at container start by the web service run script.
    location = /config.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
